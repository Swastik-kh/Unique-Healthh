[build]
  publish = "dist"
  command = "npm run build"

[[redirects]]
  from = "/api/sms/send"
  to = "/.netlify/functions/sms-send"
  status = 200

[[redirects]]
  from = "/api/email/send"
  to = "/.netlify/functions/email-send"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
