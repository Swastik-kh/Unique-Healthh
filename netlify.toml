[build]
  publish = "dist"
  command = "npm run build"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/api/sms/send"
  to = "/.netlify/functions/sms-send"
  status = 200

[[redirects]]
  from = "/api/email/send"
  to = "/.netlify/functions/email-send"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
